services:
  # Laravel App
  app:
    build: .
    container_name: canela-app
    volumes: 
      - .:/var/www
    networks:
      - canela-net

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: canela-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - canela-net

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: canela-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-canela_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    networks:    
      - canela-net

  # Redis (Caché y Sostenibilidad)
  redis:
    image: redis:alpine
    container_name: canela-redis
    networks:
      - canela-net

networks:
  canela-net:
    driver: bridge